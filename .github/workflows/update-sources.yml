name: Update LibreTV Sources

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update LibreTV sources
        run: python build_sources.py

      - name: Generate TVBox / 影视仓 config
        run: python build_tvbox.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json tvbox.json
          if git diff --cached --quiet; then
            echo "Sources unchanged"
          else
            git commit -m "Auto update LibreTV and TVBox sources"
            git push
          fi
