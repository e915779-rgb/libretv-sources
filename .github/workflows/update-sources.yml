name: Update and Check LibreTV Sources

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync upstream LibreTV sources
        run: python build_sources.py

      - name: Generate TVBox / 影视仓 config
        run: python build_tvbox.py

      - name: Check all source APIs
        run: python check_sources.py

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libretv-api-health-report
          path: |
            health-report.json
            health-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Commit source updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json tvbox.json
          if git diff --cached --quiet; then
            echo "Sources unchanged"
          else
            git commit -m "Auto sync LibreTV and TVBox sources"
            git push
          fi
